function updateHUD(){$('hp').style.width=100*clamp(s.health/maxhp(),0,1)+'%';$('st').style.width=100*clamp(s.stamina/maxst(),0,1)+'%';$('xp').style.width=100*clamp(s.xp/needXP(),0,1)+'%';$('hpText').textContent='HP '+Math.ceil(s.health)+' / '+maxhp();$('stText').textContent='ST '+Math.ceil(s.stamina)+' / '+maxst();$('xpText').textContent='XP '+s.xp+' / '+needXP();$('lvl').textContent='Lv '+s.level+' · Potions '+s.potion;$('wallet').textContent='◈ '+s.coins.toLocaleString()+' coins · ◆ '+s.gems+' gems';$('realmLabel').textContent='Realm '+(s.realm+1)+'/50 · '+NAMES[s.realm];$('quest').textContent='Realm Objective';$('questText').textContent='Defeat the guardian ('+(boss&&boss.dead?'✓':'pending')+') and '+challengeGoal+' enemies ('+Math.min(challenge,challengeGoal)+'/'+challengeGoal+'). Exit gate is east. '+(merchant?'Merchant is on the minimap.':'')}
function renderPanel(){let panel=$('panel');panel.replaceChildren();const add=(html)=>{let d=document.createElement('div');d.innerHTML=html;panel.append(d);return d};if(tab==='shop'){add('<h2>Mystery Crates</h2><div class="small">Exactly one weapon per crate. Percentages are real weighted odds.</div>');crates.forEach((c,i)=>{let locked=s.level<c[2],d=add('<div class="item"><b>'+c[0]+'</b><div class="small">'+(c[3]?'◆ Gems':'◈ Coins')+' '+c[1]+' · '+(locked?'Unlocks Lv '+c[2]:'Available')+'</div><div class="small">'+c[4].map((p,j)=>R[j]+': '+p+'%').join(' · ')+'</div></div>');let b=document.createElement('button');b.textContent='Open';b.disabled=locked|| (c[3]?s.gems<sCost(i):s.coins<c[1]);b.onclick=()=>{if(locked)return;let cost=c[1];if(c[3]?s.gems<cost:s.coins<cost)return;if(c[3])s.gems-=cost;else s.coins-=cost;giveItem(makeItem(rarity(c[4])));burst(player.x,player.y,'#ffe29b',30);save();renderPanel()};d.append(b)})}else if(tab==='inventory'){add('<h2>Equipment · '+s.inventory.length+' items</h2><div class="small">Equipped weapon: '+(s.inventory.find(i=>i.id===s.equipped)?.name||'Training Sword')+' · Base attack '+Math.round(damage())+'</div>');for(let i of [...s.inventory].reverse()){let d=add('<div class="item"><b class="rar'+i.rarity+'">'+i.name+'</b> '+(s.equipped===i.id?'✓ Equipped':'')+'<div class="small">'+R[i.rarity]+' · +'+i.power+' attack · +'+i.crit+'% crit · Sell '+i.value+' coins'+(i.rarity>=4?' + '+(i.rarity-3)+' gems':'')+'</div></div>');let b=document.createElement('button');b.textContent=s.equipped===i.id?'Unequip':'Equip';b.onclick=()=>{s.equipped=s.equipped===i.id?null:i.id;save();renderPanel()};d.append(b);let sell=document.createElement('button');sell.textContent='Sell';sell.onclick=()=>{if(!s.inventory.some(j=>j.id===i.id))return;s.inventory=s.inventory.filter(j=>j.id!==i.id);if(s.equipped===i.id)s.equipped=null;s.coins+=i.value;if(i.rarity>=4)s.gems+=i.rarity-3;save();renderPanel()};d.append(sell)}}else if(tab==='upgrades'){add('<h2>Permanent Upgrades</h2><div class="small">Upgrades remain through all realms.</div>');for(let [name,key,base,mult] of upgrades){let lv=up(key),price=Math.round(base*Math.pow(mult,lv)),locked=key==='luck'&&s.level<5;let d=add('<div class="item"><b>'+name+'</b> Lv '+lv+'<div class="small">Cost '+price+' coins · '+(locked?'Unlock at level 5':key+' +1 per purchase')+'</div></div>');let b=document.createElement('button');b.textContent='Upgrade';b.disabled=locked||s.coins<price;b.onclick=()=>{if(s.coins<price)return;s.coins-=price;s.up[key]=lv+1;if(key==='health')s.health+=22;if(key==='stamina')s.stamina+=16;save();renderPanel();audio(650,.2)};d.append(b)}}else{add('<h2>Adventure Journal</h2><p>Realms completed: '+s.clears.filter(Boolean).length+'/50</p><p>Total kills: '+s.kills+'</p><p>Secrets: '+Object.keys(s.secrets).length+'</p><p>Victory count: '+s.wins+'</p><p class="small">Chests are saved per realm. Explore the edges and clear guardians to unlock the eastern gate. Every realm has a hidden golden rune.</p>')}}function sCost(i){return crates[i][1]}
$('tabs').addEventListener('click',e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;renderPanel()}});$('save').onclick=()=>{save();notify('Progress saved')};$('mute').onclick=()=>{muted=!muted;$('mute').textContent='Sound: '+(muted?'Off':'On')};$('reset').onclick=()=>showModal('Reset save?','This permanently deletes your current progress.',[{label:'Delete progress',fn:()=>{localStorage.removeItem('bladebound_save_v3');location.reload()}},{label:'Cancel',fn:closeModal}]);function togglePause(){if($('modal').classList.contains('show')){closeModal();return}if(paused){paused=false;return}showModal('Paused','Your journey is paused.',[{label:'Resume',fn:closeModal},{label:'Save',fn:()=>{save();closeModal();notify('Saved')}}])}$('pause').onclick=togglePause;
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright','shift','w','a','s','d'].includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;if(k==='escape')togglePause();if(k===' ')attack();if(k==='h')attack(true);if(k==='shift')dash();if(k==='q')magic();if(k==='e')interact();if(k==='1')heal()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);window.addEventListener('blur',()=>keys={});C.addEventListener('pointerdown',e=>{let r=C.getBoundingClientRect(),x=(e.clientX-r.left)*C.width/r.width+camera.x,y=(e.clientY-r.top)*C.height/r.height+camera.y;let enemy=enemies.find(a=>!a.dead&&Math.hypot(a.x-x,a.y-y)<26);if(enemy){target=enemy;if(dist(enemy,player)<70){player.dir=Math.abs(enemy.x-player.x)>Math.abs(enemy.y-player.y)?enemy.x>player.x?0:2:enemy.y>player.y?1:3;attack()}}else{target=null;player.dir=Math.abs(x-player.x)>Math.abs(y-player.y)?x>player.x?0:2:y>player.y?1:3;attack()}});for(let b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(k===' ')attack();if(k==='shift')dash();if(k==='q')magic();if(k==='e')interact();b.setPointerCapture(e.pointerId)});for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys[k]=false)}
let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}buildRealm();requestAnimationFrame(frame);setInterval(()=>{if(!paused){s.kills=Math.max(s.kills,0);save()}},12000);
</script></body></html>
